# Respaldo semanal de la base de datos. El repositorio es público, así que el volcado (con datos
# reales de clientes) se cifra antes de subirlo como archivo adjunto del flujo de trabajo; sin la
# frase secreta (BACKUP_ENCRYPTION_KEY) nadie puede leerlo, aunque lo descargue.
#
# Se guardan tres archivos (como indica la guía de Supabase "Backup and restore using the CLI"):
#   roles.sql   los roles de la base de datos
#   schema.sql  la estructura (tablas, funciones, reglas...)
#   data.sql    los datos: negocios, citas, clientes, pagos... y también las cuentas (auth.users)
# Antes, solo se guardaba la estructura (supabase db dump sin --data-only no incluye los datos).
#
# Para restaurar un respaldo (mejor primero en un Supabase de pruebas, nunca encima del real):
#   1. Entra a Actions > Respaldo de la base de datos > el run que quieras > descarga el archivo.
#   2. Descifrar:   openssl enc -d -aes-256-cbc -pbkdf2 -in respaldo.tar.gz.enc -out respaldo.tar.gz -k "LA_FRASE_SECRETA"
#      Descomprimir: tar -xzf respaldo.tar.gz
#   3. psql --single-transaction --variable ON_ERROR_STOP=1 \
#        --file roles.sql --file schema.sql \
#        --command 'SET session_replication_role = replica' --file data.sql \
#        --dbname "LA_CADENA_DE_CONEXION"
# (Los respaldos antiguos, "respaldo.sql.enc", se descifran igual pero solo traen la estructura.)
#
# Secretos que hay que crear en GitHub (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL        La cadena de conexión directa a Postgres (Supabase > Project Settings >
#                          Database > Connection string > URI). Incluye la contraseña de la base.
#   BACKUP_ENCRYPTION_KEY  Una frase larga inventada por ti, guardada aparte (ej. en un gestor de
#                          contraseñas). Si la pierdes, los respaldos ya hechos quedan ilegibles.
name: Respaldo de la base de datos

on:
  schedule:
    - cron: '0 9 * * 0' # domingo 09:00 UTC ≈ 04:00-05:00 en Cuba
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Volcar la base de datos
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir respaldo
          supabase db dump --db-url "$DB_URL" -f respaldo/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f respaldo/schema.sql
          supabase db dump --db-url "$DB_URL" -f respaldo/data.sql --use-copy --data-only
      - name: Comprobar que el respaldo trae los datos
        run: |
          ls -la respaldo
          # Si no están las citas, el respaldo no sirve: se marca en rojo para enterarse enseguida
          if ! grep -q 'appointments' respaldo/data.sql; then
            echo "::error::El volcado de datos no trae la tabla de citas (appointments)."
            exit 1
          fi
          if ! grep -qE '"?auth"?\."?users"?' respaldo/data.sql; then
            echo "::warning::El volcado de datos no trae las cuentas (auth.users): al restaurar, los dueños tendrían que volver a registrarse."
          fi
      - name: Cifrar el respaldo
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          tar -czf respaldo.tar.gz -C respaldo .
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in respaldo.tar.gz -out respaldo.tar.gz.enc \
            -pass env:BACKUP_KEY
          rm -rf respaldo respaldo.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-citora-${{ github.run_id }}
          path: respaldo.tar.gz.enc
          retention-days: 90
