  .thin-scroll { scrollbar-width: thin; }
  @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .anim-pop { animation: pop .25s cubic-bezier(.16,1,.3,1) both; }

  return `<button ${data} class="inline-flex items-center justify-center gap-2 font-semibold transition active:scale-[.98] ${k} ${s} ${block ? 'w-full' : ''} ${cls}">${icon ? ic(icon, size === 'sm' ? 'h-4 w-4' : 'h-[18px] w-[18px]') : ''}${label}</button>`
}

function altaShell(i, { title, sub, body, next = 'Siguiente', skip, skipKey, noFooter }) {
  const pct = ((i + 1) / ALTA_ORDER.length) * 100
  const left = ['Unos 3 minutos', 'Unos 3 minutos', 'Unos 2 minutos', 'Menos de 2 minutos', 'Un minuto', 'Último paso'][i]
  return `
  <div class="flex h-full flex-col bg-white">
    <div class="px-5 pt-4">
      <div class="flex items-center gap-3">
        ${i > 0 ? `<button data-go="${ALTA_ORDER[i - 1]}" class="-ml-2 rounded-full p-2 text-slate-500 hover:bg-slate-100" aria-label="Atrás">${ic('back')}</button>` : `<span class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-rose-400 to-orange-400 text-xs font-black text-white">C</span>`}
        <div class="flex-1">
          <div class="flex justify-between text-xs font-semibold"><span class="text-brand">Paso ${i + 1} de ${ALTA_ORDER.length}</span><span class="text-slate-400">${left}</span></div>
          <div class="mt-1.5 h-1.5 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full bg-brand transition-all duration-500" style="width:${pct}%"></div></div>
        </div>
      </div>
    </div>
    <div id="scroll" class="thin-scroll flex-1 overflow-y-auto px-5 pb-6 pt-6">
      <div class="page">
        <h1 class="text-[26px] font-extrabold leading-tight tracking-tight">${title}</h1>
        ${sub ? `<p class="mt-2 text-[15px] leading-relaxed text-slate-500">${sub}</p>` : ''}
        <div class="mt-6">${body}</div>
      </div>
    </div>
    ${noFooter ? '' : `
    <div class="border-t border-slate-100 bg-white px-5 pb-5 pt-3">
      ${btn(next, { act: 'altaNext', arg: i, size: 'lg', block: true })}
      ${skip ? `<button data-act="altaSkip" data-arg="${i}|${skipKey}" class="mt-2 w-full rounded-xl py-2.5 text-[15px] font-semibold text-slate-500 hover:bg-slate-50">${skip}</button>` : ''}
    </div>`}
  </div>`
}

function timeline(items) {

  return card(`

  `)

    return `<div class="absolute inset-0 z-30 flex flex-col justify-end">
      <button data-act="closeSheet" class="anim-fade absolute inset-0 bg-slate-900/40" aria-label="Cerrar"></button>

  if (s.type === 'cita') {
    const a = state.appts.find((x) => x.id === s.id)
    return sheetWrap(`
      ${head(a.n, `Hoy · ${a.t} – ${a.e}`)}
      <div class="mb-4">${ST[a.st]}</div>
      ${card(`<div class="divide-y divide-slate-100 text-[15px]">

    text: 'Apúntala tú. Así ese hueco deja de estar libre y <b>nadie más puede reservarlo</b> a la misma hora.',
    doit: 'Toca {plus}' },
  { screen: 'p-hoy', sheet: { type: 'nueva' }, target: 'guardar', emoji: '✍️', title: 'Rellenas tres cosas y guardas',
    text: '<b>Quién</b> viene, <b>qué</b> se va a hacer y <b>qué día y a qué hora</b>. Al guardar, la cita aparece en tu día como cualquier otra.' },
  { screen: 'p-hoy', target: 'nav-p-negocio', tap: true, emoji: '🔗', title: 'Ahora, lo más importante',
    text: 'Para que te lleguen reservas, tus clientes tienen que <b>conocer tu enlace</b>. Lo encuentras en "Mi negocio".',
    doit: 'Toca <b>Mi negocio</b>, {abajo}' },
  { screen: 'p-negocio', target: 'compartir', tap: true, emoji: '📣', title: 'Este es tu enlace',
    text: 'Es como tu tienda en internet: quien lo abre ve tus servicios y <b>reserva solo</b>, sin tener que escribirte. Ponlo en tu estado de WhatsApp y en tu Instagram.',
    doit: 'Toca el botón verde <b>Compartir</b>' },
  { screen: 'p-negocio', target: 'nav-p-mas', tap: true, emoji: '🔔', title: 'Un último paso: los avisos',
    text: 'Para que tu móvil <b>suene cuando alguien reserve</b>, hay que activar los avisos. Están en "Más".',
    doit: 'Toca <b>Más</b>, {abajo}' },
  { screen: 'p-mas', target: 'avisos', emoji: '🔔', title: 'Actívalos en "Ajustes y avisos"',
    text: 'Hazlo en <b>cada móvil</b> que uses. Sin los avisos, las reservas te llegan igual, pero <b>no te enteras</b> hasta que abres Citora.' },
  { kind: 'final' },
]
const TOUR_STEPS = TOUR.length - 2
const tourStep = () => (state.tutorial === null ? null : TOUR[state.tutorial])
const tourText = (s) => s.replaceAll('{plus}', isMobile() ? 'el botón <b>+</b>' : '<b>Nueva cita</b>').replaceAll('{abajo}', isMobile() ? 'abajo' : 'a la izquierda')

function setTourStep(i) {
  state.tutorial = i
  const st = TOUR[i]
  if (st.screen && st.screen !== state.screen) { state.screen = st.screen; state.resetScroll = true }
  state.sheet = st.sheet ? { ...st.sheet } : null
  st.enter?.()
}

/** Contenedor con scroll más cercano (la pantalla o una hoja) */
function scrollParent(el) {
  for (let p = el.parentElement; p && p.id !== 'screen'; p = p.parentElement) {
    const oy = getComputedStyle(p).overflowY
    if ((oy === 'auto' || oy === 'scroll') && p.scrollHeight > p.clientHeight) return p
  }
  return null
}

function tourModal(st, anim) {
  const item = (n, t) => `<li class="flex items-start gap-3"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-brand/10 text-sm font-bold text-brand">${n}</span><span class="pt-0.5 text-[15px] text-slate-700">${t}</span></li>`
  const check = (t) => `<li class="flex items-start gap-3"><span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-emerald-500 text-white">${ic('check', 'h-3.5 w-3.5')}</span><span class="text-[15px] text-slate-700">${t}</span></li>`
  if (st.kind === 'intro') {
    return `<div class="pointer-events-auto w-full max-w-sm rounded-3xl bg-white p-6 shadow-2xl ${anim}">
      <p class="text-4xl">👋</p>
      <h2 class="mt-3 text-[22px] font-extrabold leading-tight tracking-tight">Te enseñamos a usar tu panel</h2>
      <p class="mt-1.5 text-[15px] leading-relaxed text-slate-600">Te llevamos de la mano, pantalla por pantalla. Vas a aprender a:</p>
      <ol class="mt-4 space-y-2.5">${item(1, 'Ver tus citas del día')}${item(2, 'Confirmar una cita nueva')}${item(3, 'Apuntar una cita que te pidieron por WhatsApp')}${item(4, 'Compartir tu enlace para que te reserven')}</ol>
      <p class="mt-5 rounded-xl bg-slate-50 p-3 text-sm leading-relaxed text-slate-500">Usamos <b>citas de ejemplo</b>: no se envía nada a nadie. Son unos 2 minutos y puedes salir cuando quieras.</p>
      <div class="mt-5 space-y-1.5">${btn('Empezar', { act: 'nextTutorial', size: 'lg', block: true })}<button data-act="endTutorial" class="w-full rounded-xl py-2.5 text-[15px] font-semibold text-slate-500 hover:bg-slate-50">Ahora no</button></div>
    </div>`
  }
  return `<div class="pointer-events-auto w-full max-w-sm rounded-3xl bg-white p-6 shadow-2xl ${anim}">
    <p class="text-4xl">🎉</p>
    <h2 class="mt-3 text-[22px] font-extrabold leading-tight tracking-tight">¡Ya sabes lo básico!</h2>
    <p class="mt-1.5 text-[15px] text-slate-600">Esto es lo que aprendiste:</p>
    <ul class="mt-4 space-y-3">${check('En <b>Hoy</b> ves tus citas del día.')}${check('<b>Confirmar</b> es decirle al cliente que lo esperas.')}${check(`Con ${isMobile() ? 'el botón <b>+</b>' : '<b>Nueva cita</b>'} apuntas las citas que te piden por WhatsApp.`)}${check('Tu <b>enlace</b> está en <b>Mi negocio</b>: compártelo para recibir reservas.')}</ul>
    <p class="mt-5 rounded-xl bg-slate-50 p-3 text-sm leading-relaxed text-slate-500">¿Se te olvidó algo? Repite el tutorial cuando quieras en <b>Más → Tutorial paso a paso</b>.</p>
    <div class="mt-5">${btn('Empezar a usar Citora', { act: 'finishTutorial', size: 'lg', block: true })}</div>
  </div>`
}

let tourAnimFor = null
function placeTour() {
  document.getElementById('tour')?.remove()
  const st = tourStep()
  const screen = document.getElementById('screen')
  if (!st || !screen) return
  const anim = tourAnimFor !== state.tutorial ? 'tour-in' : ''
  tourAnimFor = state.tutorial
  const S = screen.getBoundingClientRect()

  if (st.kind) {
    screen.insertAdjacentHTML('beforeend', `<div id="tour" class="absolute inset-0 z-[45] flex items-center justify-center bg-slate-900/60 p-4">${tourModal(st, anim)}</div>`)
    return
  }

  // Lo que se resalta: se lleva a la vista y se mide (recortado a la parte visible)
  const t = screen.querySelector(`[data-tour="${st.target}"]`)
  let R = null
  if (t) {
    const sc = scrollParent(t)
    if (sc) {
      const c = sc.getBoundingClientRect()
      const r = t.getBoundingClientRect()
      const offset = r.height < c.height * 0.45 ? c.height * 0.18 : 12
      sc.scrollTop += r.top - (c.top + offset)
    }
    const r = t.getBoundingClientRect()
    let top = r.top
    let bottom = r.bottom
    if (sc) {
      const c = sc.getBoundingClientRect()
      top = Math.max(top, c.top)
      bottom = Math.min(bottom, c.bottom)
    }
    const pad = 6
    R = { x: r.left - S.left - pad, y: top - S.top - pad, w: r.width + pad * 2, h: bottom - top + pad * 2 }
  }

  const px = (o) => Object.entries(o).map(([k, v]) => `${k}:${Math.round(v)}px`).join(';')
  let html = ''
  if (R) {
    html += `<div class="pointer-events-none absolute rounded-2xl ring-2 ring-white transition-all duration-300" style="${px({ left: R.x, top: R.y, width: R.w, height: R.h })};box-shadow:0 0 0 9999px rgb(15 23 42 / .62)"></div>`
    if (st.tap) {
      html += `<div class="pointer-events-none absolute animate-ping rounded-2xl ring-4 ring-white/70" style="${px({ left: R.x, top: R.y, width: R.w, height: R.h })};animation-duration:1.6s"></div>`
      // Cuatro piezas alrededor del hueco: el resto no se puede tocar, el botón resaltado sí
      ;[[0, 0, S.width, R.y], [0, R.y + R.h, S.width, S.height - R.y - R.h], [0, R.y, R.x, R.h], [R.x + R.w, R.y, S.width - R.x - R.w, R.h]]
        .forEach(([l, tp, w, h]) => { if (w > 0 && h > 0) html += `<div class="pointer-events-auto absolute" style="${px({ left: l, top: tp, width: w, height: h })}"></div>` })
    } else {
      html += `<div class="pointer-events-auto absolute inset-0"></div>`
    }
  } else {
    html += `<div class="pointer-events-auto absolute inset-0 bg-slate-900/60"></div>`
  }

  // La tarjeta: debajo o encima de lo resaltado, donde haya más sitio
  const W = isMobile() ? S.width - 24 : Math.min(380, S.width - 24)
  const left = R ? Math.min(Math.max(R.x + R.w / 2 - W / 2, 12), S.width - W - 12) : (S.width - W) / 2
  let pos
  let arrow = ''
  const NEED = 250
  if (R && S.height - (R.y + R.h) >= NEED && S.height - (R.y + R.h) >= R.y) {
    pos = { left, top: R.y + R.h + 14 }
    arrow = 'top'
  } else if (R && R.y >= NEED) {
    pos = { left, bottom: S.height - R.y + 14 }
    arrow = 'bottom'
  } else {
    pos = { left, bottom: 12 }
  }
  const ax = R ? Math.min(Math.max(R.x + R.w / 2 - left, 24), W - 24) : 0
  const k = state.tutorial
  html += `<div class="pointer-events-auto absolute rounded-2xl bg-white p-4 shadow-2xl ring-1 ring-black/5 ${anim}" style="${px({ ...pos, width: W })}">
    ${arrow ? `<span class="absolute h-3.5 w-3.5 rotate-45 bg-white" style="left:${Math.round(ax - 7)}px;${arrow}:-7px"></span>` : ''}
    <div class="flex items-center gap-3">
      <span class="shrink-0 text-xs font-bold text-slate-400">Paso ${k} de ${TOUR_STEPS}</span>
      <span class="h-1.5 flex-1 overflow-hidden rounded-full bg-slate-100"><span class="block h-full rounded-full bg-brand transition-all duration-500" style="width:${(k / TOUR_STEPS) * 100}%"></span></span>
      <button data-act="endTutorial" class="shrink-0 rounded-lg px-2 py-1 text-xs font-semibold text-slate-400 hover:bg-slate-100 hover:text-slate-600">Salir</button>
    </div>
    <div class="mt-3 flex gap-3">
      <span class="text-[28px] leading-none">${st.emoji}</span>
      <div class="min-w-0"><p class="text-[17px] font-extrabold leading-snug text-slate-900">${st.title}</p><p class="mt-1 text-[15px] leading-relaxed text-slate-600">${tourText(st.text)}</p></div>
    </div>
    ${st.tap ? `<div class="mt-3 flex items-center gap-2.5 rounded-xl bg-brand/10 px-3 py-2.5 text-[15px] text-brand"><span class="text-xl leading-none">👆</span><span class="flex-1">${tourText(st.doit)}</span></div>` : ''}
    <div class="mt-3 flex min-h-[40px] items-center justify-between gap-3">
      ${k > 1 ? `<button data-act="prevTutorial" class="rounded-lg px-2 py-1.5 text-sm font-semibold text-slate-500 hover:bg-slate-100">← Atrás</button>` : '<span></span>'}
      ${st.tap
        ? `<button data-act="tourDoIt" class="rounded-lg px-2 py-1.5 text-sm font-semibold text-slate-400 underline-offset-2 hover:underline">Hazlo por mí</button>`
        : `<button data-act="nextTutorial" class="rounded-xl bg-brand px-5 py-2.5 text-sm font-bold text-white shadow-sm shadow-brand/30">Siguiente →</button>`}
    </div>
  </div>`

  screen.insertAdjacentHTML('beforeend', `<div id="tour" class="pointer-events-none absolute inset-0 z-[45]">${html}</div>`)
}

const toastHTML = () => state.toast ? `<div class="anim-pop absolute left-1/2 top-16 z-[60] w-[88%] max-w-sm -translate-x-1/2 rounded-xl bg-slate-900 px-4 py-3 text-center text-sm font-semibold text-white shadow-xl">${state.toast}</div>` : ''

// =====================================================================
// Acciones
// =====================================================================
let toastTimer
const ACTIONS = {
  pickType: (k) => { state.type = Number(k); go('alta-negocio') },
  currency: (k) => { state.currency = k },
  toggleDay: (d) => { d = Number(d); state.days = state.days.includes(d) ? state.days.filter((x) => x !== d) : [...state.days, d] },
  altaNext: (i) => { i = Number(i); go(i === ALTA_ORDER.length - 1 ? 'alta-bienvenida' : ALTA_ORDER[i + 1]) },
  altaSkip: (v) => {
    const [i, key] = v.split('|')
    state.skipped[key] = true
    if (key === 'servicios') state.done.precios = false
    go(ALTA_ORDER[Number(i) + 1])
  },
  startTutorial: () => {
    state.appts = freshAppts()
    state.stepsOpen = false
    state.dayTab = 'hoy'
    state.tutorial = 0
    go('p-hoy', true)
  },
  nextTutorial: () => setTourStep(state.tutorial + 1),
  prevTutorial: () => setTourStep(state.tutorial - 1),
  endTutorial: () => { state.tutorial = null; state.sheet = null },
  finishTutorial: () => { state.tutorial = null; state.stepsOpen = true; go('p-hoy') },
  tourDoIt: () => { const st = tourStep(); document.querySelector(`#screen [data-tour="${st.target}"]`)?.click() },
  toggleSteps: () => { state.stepsOpen = !state.stepsOpen },
  step: (id) => {
    const s = STEPS.find((x) => x.id === id)
    if (s.auto) return toast('Se marca sola cuando un cliente reserve desde tu enlace')
    if (s.go && !state.done[id] && state.screen !== s.go) { state.done[id] = true; return go(s.go) }
    state.done[id] = !state.done[id]
    if (id === 'avisos') state.pushOn = state.done[id]
    if (STEPS.filter((x) => !x.auto).every((x) => state.done[x.id])) { state.done.primera = true; toast('🎉 ¡Primera reserva recibida! (simulado)') }
  },
  dayTab: (t) => { state.dayTab = t },
  agendaDay: (d) => { state.agendaDay = Number(d) },
  custFilter: (f) => { state.custFilter = f },
  bizFilter: (f) => { state.bizFilter = f },
  confirm: (id) => { const a = state.appts.find((x) => x.id === Number(id)); if (a) { a.st = 'confirmada'; state.sheet = null; toast(`Cita de ${a.n.split(' ')[0]} confirmada`) } },
  markDone: (id) => { const a = state.appts.find((x) => x.id === Number(id)); a.st = 'hecha'; state.sheet = null; toast('Marcada como hecha') },
  openAppt: (id) => { state.sheet = { type: 'cita', id: Number(id) } },
  newAppt: (time) => { state.sheet = { type: 'nueva', time } },
  openCust: (k) => { state.sheet = { type: 'cliente', id: Number(k) } },
  editService: (k) => { state.sheet = { type: 'servicio', id: Number(k) } },
  saveService: () => { state.sheet = null; state.done.precios = true; toast('Servicio guardado') },
  openBiz: (id) => { state.sheet = { type: 'negocio', id: Number(id) } },
  closeSheet: () => { state.sheet = null },
  tool: (id) => { state.tools.push(id); toast(`${TOOLS.find((t) => t.id === id).n} activado. Ya está en tus herramientas.`) },
  months: (m) => { state.months = Number(m) },
  push: () => { state.pushOn = !state.pushOn; state.done.avisos = state.pushOn },
  color: (c) => setBrand(c),
  shareLink: () => { state.done.compartir = true; toast('Se abriría WhatsApp con tu enlace y una imagen lista para tu estado') },
  toast: (m) => toast(m),
  device: (d) => { state.device = d },
  goScreen: (s) => go(s),
}

function toast(m) {
  state.toast = m
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { state.toast = null; render() }, 2600)
}

function go(s, keepTutorial) {
  const before = groupOf(state.screen)
  const after = groupOf(s)
  if (before !== after) state.device = after.device
  state.screen = s
  state.sheet = null
  if (!keepTutorial) state.tutorial = null
  if (s === 'alta-tipo') { state.skipped = {}; state.done = { precios: true }; state.appts = freshAppts() }
  render(true)
}

function setBrand(hex) {
  state.brand = hex
  document.documentElement.style.setProperty('--brand-rgb', hexToRgb(hex))
}

// =====================================================================
// Pintar
// =====================================================================
function render(resetScroll) {
  if (state.resetScroll) { resetScroll = true; state.resetScroll = false }
  const prevScroll = document.getElementById('scroll')?.scrollTop || 0
  const g = groupOf(state.screen)

  document.getElementById('index').innerHTML = GROUPS.map((gr) => `
    <p class="mb-1.5 mt-5 px-2 text-xs font-bold uppercase tracking-[0.12em] text-slate-400 first:mt-0">${gr.title}</p>
    ${gr.items.map(([k, l]) => `<button data-go="${k}" class="block w-full rounded-lg px-2 py-1.5 text-left text-sm font-medium transition ${state.screen === k ? 'bg-white font-bold text-slate-900 shadow-sm ring-1 ring-slate-200' : 'text-slate-600 hover:bg-white/60'}">${l}</button>`).join('')}
  `).join('')

  document.getElementById('pick').innerHTML = GROUPS.map((gr) => `<optgroup label="${gr.title}">${gr.items.map(([k, l]) => `<option value="${k}" ${state.screen === k ? 'selected' : ''}>${l}</option>`).join('')}</optgroup>`).join('')

  document.getElementById('devices').innerHTML = [['movil', 'Móvil'], ['ordenador', 'Ordenador']].map(([k, l]) => `<button data-act="device" data-arg="${k}" class="rounded-md px-3 py-1 transition ${state.device === k ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}">${l}</button>`).join('')

  const small = window.innerWidth < 640
  const frame = document.getElementById('frame')
  const inner = SCREENS[state.screen]() + sheetHTML() + toastHTML()
  if (isMobile()) {
    frame.className = small ? 'w-full' : 'rounded-[2.6rem] bg-slate-900 p-2.5 shadow-2xl shadow-slate-900/30'
    frame.innerHTML = `<div id="screen" class="${state.tutorial !== null ? "touring" : ""} relative overflow-hidden ${small ? 'h-[calc(100dvh-140px)] rounded-2xl ring-1 ring-slate-200' : 'h-[800px] w-[390px] rounded-[2rem]'} bg-white">${inner}</div>`
  } else {
    frame.className = 'w-full max-w-[1200px] overflow-hidden rounded-xl bg-white shadow-2xl shadow-slate-900/15 ring-1 ring-slate-200'
    frame.innerHTML = `<div class="flex items-center gap-2 border-b border-slate-200 bg-slate-100 px-4 py-2.5"><span class="h-3 w-3 rounded-full bg-red-400"></span><span class="h-3 w-3 rounded-full bg-amber-400"></span><span class="h-3 w-3 rounded-full bg-emerald-400"></span><span class="ml-4 flex-1 rounded-md bg-white px-3 py-1 text-xs text-slate-400">citora.app/${g.key === 'admin' ? 'admin' : g.key === 'alta' ? 'crear' : BIZ.slug + '/panel'}</span></div>
      <div id="screen" class="${state.tutorial !== null ? "touring" : ""} relative h-[760px] overflow-hidden">${g.key === 'alta' ? `<div class="mx-auto h-full max-w-lg border-x border-slate-100">${inner}</div>` : inner}</div>`
  }

  const [title, bullets] = NOTES[state.screen]
  const notes = `<div class="rounded-2xl bg-white p-5 ring-1 ring-slate-200">
    <p class="text-xs font-bold uppercase tracking-[0.12em] text-citora-600">Qué cambia</p>
    <h3 class="mt-1 text-lg font-extrabold tracking-tight">${title}</h3>
    <ul class="mt-3 space-y-2.5 text-[14px] leading-relaxed text-slate-600">${bullets.map((b) => `<li class="flex gap-2"><span class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-citora-500"></span><span>${b}</span></li>`).join('')}</ul>
    <p class="mt-5 rounded-xl bg-slate-50 p-3 text-[13px] text-slate-500">Para pedir cambios, dime el nombre de la pantalla y lo que quieres distinto. Ej.: <i>"En Hoy, quita la tarjeta de la próxima cita"</i>.</p>
  </div>`
  document.getElementById('notes').innerHTML = `<div class="sticky top-20">${notes}</div>`
  document.getElementById('notes-mobile').innerHTML = `<div class="mx-auto mt-2 max-w-xl">${notes}</div>`

  const sc = document.getElementById('scroll')
  if (sc && !resetScroll) sc.scrollTop = prevScroll

  // El tutorial se coloca cuando la pantalla ya está pintada (y se recoloca al terminar las animaciones)
  if (state.tutorial !== null) {
    requestAnimationFrame(placeTour)
    setTimeout(placeTour, 150)
    setTimeout(placeTour, 450)
  }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-go],[data-act]')
  if (!el) return
  // En un paso práctico del tutorial, tocar lo resaltado hace lo de siempre y pasa al siguiente paso
  const st = tourStep()
  const isTap = Boolean(st && st.tap && el.closest('[data-tour]')?.dataset.tour === st.target)
  if (el.dataset.go) go(el.dataset.go, isTap)
  else ACTIONS[el.dataset.act]?.(el.dataset.arg)
  if (isTap) {
    setTourStep(state.tutorial + 1)
    if (st.done) toast(st.done)
  }
  render()
})
document.addEventListener('input', (e) => {
  if (e.target.dataset.bind === 'name') {
    BIZ.name = e.target.value || 'Tu negocio'
    BIZ.slug = BIZ.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'tu-negocio'
    const s = document.getElementById('slug')
    if (s) s.value = BIZ.slug
  }
})
document.getElementById('pick').addEventListener('change', (e) => go(e.target.value))
window.addEventListener('resize', () => render())

setBrand('#7c3aed')
// Abrir una pantalla concreta desde la dirección: index.html#a-inicio o index.html#p-hoy/ordenador
;(() => {
  const [s, d, t] = decodeURIComponent(location.hash.slice(1)).split('/')
  if (s && SCREENS[s]) { state.screen = s; state.device = groupOf(s).device }
  if (d === 'movil' || d === 'ordenador') state.device = d
  // ...#p-hoy/movil/tutorial3 abre el tutorial en el paso 3
  const m = /^tutorial(\d+)$/.exec(t || '')
  if (m) { state.stepsOpen = false; for (let i = 0; i <= Math.min(Number(m[1]), TOUR.length - 1); i++) setTourStep(i) }
})()
render(true)
</script>
