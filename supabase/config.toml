# Configuración mínima para levantar Supabase en local (CLI) y en la Acción de GitHub que
# comprueba supabase/schema.sql y supabase/test/test.sql antes de cada subida. No hace falta
# tocar esto para usar la app: solo lo usa `supabase start` y la Acción "Pruebas de la base de datos".
project_id = "citora"

[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"

[storage]
enabled = true
