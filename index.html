<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5243e5" />
    <meta name="description" content="Citora: crea la app de reservas de tu negocio en minutos." />
    <title>Citora · Reservas para tu negocio</title>
    <script>
      // Modo oscuro antes de pintar (ver src/lib/theme.ts)
      try {
        var t = JSON.parse(localStorage.getItem('citora:tema') || 'null')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
