<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5243e5" />
    <meta name="description" content="Citora: crea la app de reservas de tu negocio en minutos." />
    <title>Citora · Reservas para tu negocio</title>
    <!-- Vista previa al compartir el enlace (WhatsApp, redes). Cada negocio reserva desde la
         portada con ?c=slug, así que el rastreador siempre ve esta misma página: no se puede
         poner aquí el nombre o logo de cada negocio sin un servidor que distinga a ese rastreador
         del visitante real (ver scripts/og-image.svg si hace falta regenerar la imagen). -->
    <meta property="og:title" content="Citora · Reservas para tu negocio" />
    <meta property="og:description" content="Crea la app de reservas de tu negocio en minutos. Tus clientes reservan solos, tú llevas la agenda." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://tnt991129.github.io/Citora/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Citora · Reservas para tu negocio" />
    <meta name="twitter:description" content="Crea la app de reservas de tu negocio en minutos." />
    <meta name="twitter:image" content="https://tnt991129.github.io/Citora/og-image.png" />
    <script>
      // Modo oscuro antes de pintar (ver src/lib/theme.ts)
      try {
        var t = JSON.parse(localStorage.getItem('citora:tema') || 'null')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
